<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | BMS+DemoVersion0.1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width=450 height=800 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="loading-animation">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div id="download-info"></div> <!-- Display for downloaded size -->
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
            <div id="unity-logo-title-footer"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">BMS+DemoVersion0.1</div>
        </div>
    </div>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var downloadInfo = document.querySelector("#download-info");

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/wwwroot.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/wwwroot.data.br",
            frameworkUrl: buildUrl + "/wwwroot.framework.js.br",
            codeUrl: buildUrl + "/wwwroot.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "Jgames",
            productName: "BMS+DemoVersion0.1",
            productVersion: "0.1",
        };

        var totalSize = 0; // Initialize total size
        var loadedSize = 0; // Initialize downloaded size

        function loadWithProgress(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.responseType = 'arraybuffer';
            xhr.onprogress = function (event) {
                if (event.lengthComputable) {
                    totalSize = event.total;
                    loadedSize = event.loaded;
                    const progressPercentage = (loadedSize / totalSize) * 100;
                    document.querySelector("#unity-progress-bar-full").style.width = progressPercentage + "%";
                    downloadInfo.textContent = `${formatBytes(loadedSize)} / ${formatBytes(totalSize)}`;
                }
            };
            xhr.onload = function () {
                callback(xhr.response);
            };
            xhr.send();
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        loadWithProgress(loaderUrl, function (data) {
            var script = document.createElement("script");
            script.src = URL.createObjectURL(new Blob([data], { type: 'application/javascript' }));
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
                    let downloadInfo = document.querySelector("#download-info");
                    if (progress >= 0.9) {
                        downloadInfo.textContent = `Decompression in progress, please wait a moment...`;
                    } else {
                        downloadInfo.textContent = `${(100 * progress).toFixed(2)} %`; // 2 decimal points
                    }
                }).then((unityInstance) => {
                    document.querySelector("#unity-loading-bar").style.display = "none";
                    document.querySelector("#unity-fullscreen-button").onclick = () => {
                        unityInstance.SetFullscreen(1);
                    };
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
